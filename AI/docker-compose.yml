# Optional: PostgreSQL for local development / the demo.
#   docker compose up -d db
# Then set DATABASE_URL=postgresql+psycopg://opportunityos:<password>@localhost:5432/opportunityos
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opportunityos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: opportunityos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunityos"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
