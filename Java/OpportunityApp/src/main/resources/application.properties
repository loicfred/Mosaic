spring.application.name=OpportunityApp
server.port=8080

# The Python analytics API in AI/ (it serves on 127.0.0.1:8000; keep the two in step).
mosaic.api.base-url=http://127.0.0.1:8000
# The API only computes figures, so a slow answer means something is wrong.
mosaic.api.timeout-seconds=30

# Start `python -m app.main` with the website unless the API is already answering; stopped on shutdown.
mosaic.python.autostart=true
# Empty: SolarHome/config/py/mosaic/.venv if present, else python from PATH.
mosaic.python.executable=
# Python code, CSV exports and trained models live under SolarHome/config/py/mosaic.

# The business database, SolarFramework's DatabaseImpl on SQLite. A relative file lives under SolarHome, the working directory.
spring.datasource.url=jdbc:sqlite:config/Default.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite ignores these, but SolarFramework registers no data source (and creates no table) without them: placeholders, not secrets.
spring.datasource.username=mosaic
spring.datasource.password=mosaic
# On start: fill empty tables from the Olist CSVs in source-dir, then export to SolarHome/config/py/mosaic/datasets if needed.
mosaic.data.prepare-on-start=true
mosaic.data.source-dir=../../AI/datasets

spring.thymeleaf.cache=false
