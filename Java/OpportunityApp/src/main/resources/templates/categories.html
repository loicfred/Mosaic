<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/fragments/head :: pageHead('Category health')}"></th:block>
</head>
<body>

<header th:replace="~{/fragments/header :: mainHeader}" id="master-header"></header>

<main class="mod-page mx-auto">
    <section class="mod-hero position-relative overflow-hidden">
        <h1 class="statement m-0">Which categories are falling behind the business?</h1>
        <p class="lede mt-3 mb-0" th:if="${categories != null}">
            Last <th:block th:text="${categories.recent_months}">3</th:block> months against the
            <th:block th:text="${categories.recent_months}">3</th:block> before. The business as a whole:
            <span class="v" th:text="${@format.pct(categories.total_change_pct)}">−12.7%</span>.
            Read each category's change against that figure.
        </p>
    </section>

    <section th:replace="~{/fragments/categories/table :: categoryTable}"></section>
</main>

<footer th:replace="~{/fragments/footer :: mainFooter}" id="master-footer"></footer>
</body>
</html>
