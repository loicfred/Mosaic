<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/fragments/head :: pageHead('What if sales change?')}"></th:block>
</head>
<body>

<header th:replace="~{/fragments/header :: mainHeader}" id="master-header"></header>

<main class="mod-page mx-auto">
    <section class="mod-hero position-relative overflow-hidden">
        <h1 class="statement m-0">What would a change in sales do to deliveries and reviews?</h1>
        <p class="lede mt-3 mb-0">Everything below the controls is hypothetical: recent rates applied to a sales level you choose. It is not a forecast.</p>
    </section>

    <section th:replace="~{/fragments/scenario/controls :: controls}"></section>
    <div th:replace="~{/fragments/items/notice :: error(${scenarioError})}"></div>

    <th:block th:if="${scenario != null}">
        <section th:replace="~{/fragments/scenario/baseline :: baseline(${scenario})}"></section>
        <div class="mod-empty" th:if="${scenario.consequences == null}"
             th:text="${scenario.reason == 'no_baseline_activity'} ? 'No scenario: there were no sales in the recent months to start from.' : |No scenario: ${scenario.reason}|"></div>
        <th:block th:if="${scenario.consequences != null}">
            <section th:replace="~{/fragments/scenario/results :: results(${scenario})}"></section>
            <section th:replace="~{/fragments/scenario/capacity :: capacity(${scenario})}"></section>
        </th:block>
        <section th:replace="~{/fragments/scenario/narrative :: narrative(${narrative})}"></section>
        <section th:replace="~{/fragments/scenario/assumptions :: assumptions(${scenario})}"></section>
    </th:block>
</main>

<footer th:replace="~{/fragments/footer :: mainFooter}" id="master-footer"></footer>
</body>
</html>
