<!-- The two settings; moving a slider runs the scenario again (one request per change). -->
<section th:fragment="controls" aria-label="Scenario settings">
    <form class="mod-card hypo controls mod-form" id="scenario-form" method="get" th:action="@{/scenario}">
        <input type="hidden" name="run" value="1">
        <div class="row g-4 align-items-end">
            <div class="col-md-4">
                <label for="change" class="form-label mb-1">Sales change</label>
                <output id="change-out" for="change" th:text="${@format.pct(change)}">+20%</output>
                <input type="range" class="form-range" id="change" name="change" min="-50" max="100" step="5" th:value="${change}">
            </div>
            <div class="col-md-3">
                <label for="horizon" class="form-label mb-1">For how many months</label>
                <output id="horizon-out" for="horizon" th:text="${horizon}">3</output>
                <input type="range" class="form-range" id="horizon" name="horizon" min="1" max="6" step="1" th:value="${horizon}">
            </div>
            <div class="col-md-5">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="explain" value="true" id="explain" th:checked="${explain}">
                    <label class="form-check-label fw-normal" for="explain">Write a plain-language summary</label>
                </div>
                <button type="submit" class="btn btn-outline-light fw-semibold">Run scenario</button>
                <p class="small mt-2 mb-0" id="working" hidden>Working it out. A local AI summary can take up to two minutes.</p>
            </div>
        </div>
    </form>
    <script>
        (() => {
            const form = document.getElementById('scenario-form');
            const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%';
            form.addEventListener('input', () => {
                document.getElementById('change-out').textContent = sign(+form.change.value);
                document.getElementById('horizon-out').textContent = form.horizon.value;
            });
            form.addEventListener('change', e => { if (e.target.type === 'range') form.requestSubmit(); });
            form.addEventListener('submit', () => { document.getElementById('working').hidden = false; });
        })();
    </script>
</section>
