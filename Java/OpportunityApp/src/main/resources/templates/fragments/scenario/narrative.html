<!-- The written summary: the fixed template at once, replaced by the model's version if it answers faithfully.
     Called AI only when a model wrote it, and never the source of a number. -->
<section th:fragment="narrative(n)" th:if="${n != null}" id="summary"
         th:with="asking=${explain and aiStatus != null and aiStatus.reachable()}"
         th:attr="data-summary-url=${asking} ? @{/api/scenario/summary(change=${change},horizon=${horizon})} : null">
    <h2 id="summary-title" class="mod-section-title fw-semibold fs-5">Summary</h2>
    <div class="mod-card hypo">
        <p id="summary-text" class="narrative" th:text="${n.text()}"></p>
        <p id="summary-note" class="muted-note mb-0"
           th:text="${asking} ? 'Written from a fixed template while the local model writes a plain-language explanation. It can take a couple of minutes.' : 'Written from a fixed template.'"></p>
    </div>
    <p class="muted-note mt-2 mb-0" th:if="${aiStatus != null}"
       th:text="${aiStatus.reachable()} ? |Local AI: connected (${aiStatus.model()})| : (${aiStatus.enabled()} ? 'Local AI: offline. Start LM Studio to get an AI explanation.' : 'Local AI: switched off.')"></p>
    <script>
        (async () => {
            const section = document.getElementById('summary'), url = section.dataset.summaryUrl;
            if (!url) return;
            const note = document.getElementById('summary-note');
            try {
                const res = await fetch(url), n = await res.json();
                if (!res.ok) { note.textContent = 'Kept the fixed template: ' + (n.error || 'the explanation could not be written.'); return; }
                if (n.source !== 'llm') { note.textContent = 'Kept the fixed template (' + n.reason + ').'; return; }
                document.getElementById('summary-title').textContent = `AI explanation (${n.model})`;
                document.getElementById('summary-text').textContent = n.text;
                note.textContent = 'Written by a local language model from the figures above. It is commentary: every number it uses was checked against those figures.';
            } catch { note.textContent = 'Kept the fixed template: the site did not answer.'; }
        })();
    </script>
</section>
