<!-- The hidden problem, first: the whole business against the categories falling further behind it. -->
<section th:fragment="statement" class="mod-hero position-relative overflow-hidden">
    <th:block th:if="${allCategories != null and behind != null}">
        <h1 class="statement m-0">
            Over the last <th:block th:text="${allCategories.recent_months}">3</th:block> months, sales across the
            business moved <span class="v" th:text="${@format.pct(allCategories.total_change_pct)}">−12.7%</span>
            against the <th:block th:text="${allCategories.recent_months}">3</th:block> before.
        </h1>
        <p class="lede mt-3 mb-0" th:with="rule=${behind.count > 0} ? ${behind.categories[0].evidence.underperforming_total.threshold_pp} : null">
            <span class="v bad" th:text="|${behind.count} of ${allCategories.count}|">18 of 74</span> product categories
            fell further still<th:block th:if="${rule != null}">, trailing the business by at least
            <th:block th:text="${@format.num(-rule, 0)}">10</th:block> percentage points</th:block>.
            <a th:href="@{/categories(flag='underperforming_total')}">See which categories and why</a>
        </p>
    </th:block>
    <th:block th:if="${allCategories == null or behind == null}">
        <h1 class="statement m-0">Sales overview</h1>
        <div th:replace="~{/fragments/items/notice :: error(${allCategoriesError ?: behindError})}"></div>
    </th:block>
</section>
