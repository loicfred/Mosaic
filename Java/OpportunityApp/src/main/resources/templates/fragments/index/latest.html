<section th:fragment="latest">
    <h2 class="mod-section-title fw-semibold fs-5">Latest month</h2>
    <div class="mod-tiles mb-0">
        <div class="mod-tile obs" th:if="${latestSales != null}">
            <b class="mod-tile-num d-block" th:text="${@format.brl(latestSales.sales)}">BRL 0</b>
            <small th:text="|Gross item sales, ${latestSales.month}|">Sales</small>
        </div>
        <div class="mod-tile obs" th:if="${latestSales != null}">
            <b class="mod-tile-num d-block" th:text="${@format.num(latestSales.orders, 0)}">0</b>
            <small th:text="|Orders, ${latestSales.month}|">Orders</small>
        </div>
        <div class="mod-tile obs" th:if="${latestDelivery != null}">
            <b class="mod-tile-num d-block" th:text="${@format.rate(latestDelivery.late_rate, 1)}">0%</b>
            <small th:text="|Delivered late, ${latestDelivery.month} (${@format.num(latestDelivery.late, 0)} of ${@format.num(latestDelivery.delivered, 0)})|">Late</small>
        </div>
        <div class="mod-tile obs" th:if="${latestReviews != null}">
            <b class="mod-tile-num d-block" th:text="${@format.rate(latestReviews.low_rate, 1)}">0%</b>
            <small th:text="|Reviews of 1 or 2 stars, ${latestReviews.month} (${@format.num(latestReviews.low, 0)} of ${@format.num(latestReviews.reviewed, 0)})|">Low reviews</small>
        </div>
    </div>
    <div th:replace="~{/fragments/items/notice :: error(${historyError})}"></div>
    <div th:replace="~{/fragments/items/notice :: error(${deliveryError})}"></div>
    <div th:replace="~{/fragments/items/notice :: error(${reviewsError})}"></div>
</section>
