<section th:fragment="reviews">
    <h2 class="mod-section-title fw-semibold fs-5">Share of reviews with 1 or 2 stars</h2>
    <div th:replace="~{/fragments/items/notice :: error(${reviewsError})}"></div>
    <th:block th:if="${reviews != null}">
        <div class="mod-card"><div class="chart short"><canvas id="low-chart" aria-label="Monthly low review rate"></canvas></div></div>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => MosaicCharts.rate('low-chart', /*[[${reviews.monthly}]]*/ null, 'low_rate', 'Reviews of 1 or 2 stars'));
        </script>
    </th:block>
    <div th:replace="~{/fragments/items/notice :: error(${unreviewedError})}"></div>
    <th:block th:if="${unreviewed != null and !#lists.isEmpty(unreviewed.orders)}">
        <h3 class="fs-6 fw-semibold mt-4">Delivered orders with no review yet, most likely to get a low one first</h3>
        <p class="muted-note">Scored after delivery, so the delivery outcome is one of the inputs. A ranking, not a percentage chance.</p>
        <div class="mod-table table-responsive">
            <table class="table mb-0">
                <thead><tr><th>Risk score</th><th class="n">Days late</th><th class="n">Delivery days</th><th>Category</th><th class="n">Value</th><th>Order</th></tr></thead>
                <tbody>
                <tr th:each="o : ${unreviewed.orders}">
                    <td th:replace="~{/fragments/items/score :: score(${o.risk})}"></td>
                    <td class="n" th:text="${@format.num(o.days_late, 0)}"></td>
                    <td class="n" th:text="${@format.num(o.delivery_days, 0)}"></td>
                    <td th:text="${@format.label(o.category)}"></td>
                    <td class="n" th:text="${@format.brl(o.total_price)}"></td>
                    <td class="id" th:text="${o.order_id}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</section>
