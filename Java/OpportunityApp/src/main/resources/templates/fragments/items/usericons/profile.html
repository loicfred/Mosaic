<!-- SolarERP's profile icon: a round badge that opens a small menu. Mosaic keeps no avatar, so the badge shows the initial. -->
<div th:fragment="profileIcon" class="profile-icon position-relative d-flex align-items-center" th:if="${currentUser != null}">
    <button type="button" class="avatar-btn rounded-circle" id="avatarBtn" aria-haspopup="true" aria-expanded="false"
            aria-controls="avatarPopup" th:attr="aria-label='Account menu for ' + ${currentUser.displayName}"
            th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">M</button>
    <div class="avatar-popup position-absolute rounded-2" id="avatarPopup">
        <p class="avatar-popup-name m-0 fw-semibold text-truncate" th:text="${currentUser.displayName}">Name</p>
        <p class="avatar-popup-email m-0 text-truncate" th:text="${currentUser.email}">name@example.com</p>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="avatar-popup-action">Log out</button>
        </form>
    </div>
    <script>
        (() => {
            const btn = document.getElementById("avatarBtn");
            const popup = document.getElementById("avatarPopup");
            const setOpen = open => {
                popup.classList.toggle("active", open);
                btn.setAttribute("aria-expanded", open);
            };
            btn.addEventListener("click", e => {
                e.stopPropagation();
                setOpen(!popup.classList.contains("active"));
            });
            popup.addEventListener("click", e => e.stopPropagation());
            document.addEventListener("click", () => setOpen(false));
            document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
        })();
    </script>
</div>
