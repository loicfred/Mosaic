<!-- SolarERP's login icon, for a page seen signed out (every screen needs a sign-in, so only the error page shows it). -->
<a th:fragment="loginIcon" th:if="${currentUser == null}" class="login-icon d-flex align-items-center" th:href="@{/auth/v1/login}"
   aria-label="Log in">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
</a>
