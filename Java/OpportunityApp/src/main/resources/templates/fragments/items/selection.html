<!-- The period and filter fields shared by the Findings and trend pages. Blank means the default: the last 3 months
     against the 3 before, the whole business. They live only in the page address, so reloading /findings restores the defaults. -->
<fieldset th:fragment="fields(selection)" class="row g-3 no-print">
    <legend class="fs-6 fw-semibold">Periods and filters</legend>
    <div class="col-6 col-md-3"><label class="form-label" for="previous_start">Comparison from</label>
        <input class="form-control" type="month" id="previous_start" name="previous_start" min="2017-01" max="2018-08" th:value="${selection['previous_start']}"></div>
    <div class="col-6 col-md-3"><label class="form-label" for="previous_end">Comparison to</label>
        <input class="form-control" type="month" id="previous_end" name="previous_end" min="2017-01" max="2018-08" th:value="${selection['previous_end']}"></div>
    <div class="col-6 col-md-3"><label class="form-label" for="recent_start">Recent from</label>
        <input class="form-control" type="month" id="recent_start" name="recent_start" min="2017-01" max="2018-08" th:value="${selection['recent_start']}"></div>
    <div class="col-6 col-md-3"><label class="form-label" for="recent_end">Recent to</label>
        <input class="form-control" type="month" id="recent_end" name="recent_end" min="2017-01" max="2018-08" th:value="${selection['recent_end']}"></div>
    <div class="col-md-6"><label class="form-label" for="category">Category (priciest item)</label>
        <input class="form-control" id="category" name="category" maxlength="120" placeholder="e.g. health_beauty" th:value="${selection['category']}"></div>
    <div class="col-md-6"><label class="form-label" for="customer_state">Customer state</label>
        <input class="form-control" id="customer_state" name="customer_state" maxlength="2" placeholder="e.g. SP" th:value="${selection['customer_state']}"></div>
    <p class="small mb-0">Fill in all four months or none. The last month (2018-08) can still have orders on their way, so its delivery and review figures may change.</p>
</fieldset>
