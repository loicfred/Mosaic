<div th:fragment="breadcrumbBar" th:if="${crumbs != null and #lists.size(crumbs) > 1}" id="page-crumbs">
    <!-- SolarERP's breadcrumb bar, without the per-plugin icons. -->
    <style>
        #page-crumbs {
            background: var(--bg-shell);
            border-bottom: 1px solid var(--line);
        }

        #page-crumbs .breadcrumb {
            --bs-breadcrumb-divider: '\203A';
            --bs-breadcrumb-divider-color: var(--muted);
            --bs-breadcrumb-item-padding-x: 0.55rem;
            font-size: 0.82rem;
        }

        /* The last crumb is the page itself, so it is plain text - only the links light up. */
        #page-crumbs a[href] {
            color: var(--muted);
            transition: color 0.2s;
        }

        #page-crumbs a[href]:hover {
            color: var(--text-color);
            text-decoration: underline;
        }

        #page-crumbs .breadcrumb-item.active {
            color: var(--text-color);
        }
    </style>

    <nav class="container" aria-label="Breadcrumb">
        <ol class="breadcrumb m-0 py-2 flex-nowrap text-nowrap overflow-auto">
            <li th:each="c,i : ${crumbs}" class="breadcrumb-item" th:classappend="${i.last} ? 'active fw-semibold'"
                th:aria-current="${i.last} ? 'page'">
                <a th:unless="${i.last}" th:href="@{${c.url()}}" class="text-decoration-none" th:text="${c.label()}"></a>
                <span th:if="${i.last}" th:text="${c.label()}"></span>
            </li>
        </ol>
    </nav>
</div>
