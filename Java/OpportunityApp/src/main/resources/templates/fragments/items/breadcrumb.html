<div th:fragment="breadcrumbBar" th:if="${crumbs != null and #lists.size(crumbs) > 1}" id="page-crumbs">
    <!-- SolarERP's breadcrumb bar, without the per-plugin icons; styled in main.css. -->
    <nav class="container" aria-label="Breadcrumb">
        <ol class="breadcrumb m-0 py-2 flex-nowrap text-nowrap overflow-auto">
            <li th:each="c,i : ${crumbs}" class="breadcrumb-item" th:classappend="${i.last} ? 'active fw-semibold'"
                th:aria-current="${i.last} ? 'page'">
                <a th:unless="${i.last}" th:href="@{${c.url()}}" class="text-decoration-none" th:text="${c.label()}"></a>
                <span th:if="${i.last}" th:text="${c.label()}"></span>
            </li>
        </ol>
    </nav>
</div>
