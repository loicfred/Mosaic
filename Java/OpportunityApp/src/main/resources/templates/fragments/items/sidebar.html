<div th:fragment="sidebar">
    <!-- Shared business pages and evidence views. -->

    <nav id="sidebar" aria-label="Pages">
        <div class="sidebar-header">
            <p class="m-0 fw-bold">Mosaic</p>
        </div>

        <div class="sidebar-user" th:if="${currentUser != null}">
            <div class="d-flex align-items-center gap-2">
                <span class="avatar-btn rounded-circle flex-shrink-0" aria-hidden="true"
                      th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">M</span>
                <div class="flex-grow-1 overflow-hidden">
                    <p class="sidebar-user-name m-0 fw-semibold text-truncate" th:text="${currentUser.displayName}">Name</p>
                    <p class="sidebar-user-email m-0 text-truncate" th:text="${currentUser.email}">name@example.com</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0 mt-2">
                <button type="submit" class="sidebar-logout-btn">Sign Out</button>
            </form>
        </div>

        <div class="sidebar-section" th:if="${currentUser == null}">
            <a th:href="@{/auth/v1/login}" class="sidebar-login-btn">Sign In</a>
        </div>

        <div class="sidebar-section">
            <a th:href="@{/}" th:attr="aria-current=${page == 'sales'} ? 'page' : null"><i class="tile t-sales"></i>Sales</a>
            <a th:href="@{/delivery}" th:attr="aria-current=${page == 'delivery'} ? 'page' : null"><i class="tile t-delivery"></i>Delivery</a>
            <a th:href="@{/reviews}" th:attr="aria-current=${page == 'reviews'} ? 'page' : null"><i class="tile t-reviews"></i>Reviews</a>
            <a th:href="@{/sellers}" th:attr="aria-current=${page == 'sellers'} ? 'page' : null"><i class="tile t-sellers"></i>Sellers</a>
        </div>

        <div class="sidebar-section">
            <a th:href="@{/findings}" th:attr="aria-current=${page == 'findings'} ? 'page' : null">Findings</a>
            <a th:href="@{/what-if}" th:attr="aria-current=${page == 'what-if'} ? 'page' : null">What if</a>
            <a th:href="@{/data-quality}" th:attr="aria-current=${page == 'data-quality'} ? 'page' : null">Data quality</a>
            <a th:href="@{/payments}" th:attr="aria-current=${page == 'payments'} ? 'page' : null">Payments</a>
            <a th:href="@{/freight}" th:attr="aria-current=${page == 'freight'} ? 'page' : null">Freight</a>
            <a th:href="@{/cohorts}" th:attr="aria-current=${page == 'cohorts'} ? 'page' : null">Customer cohorts</a>
            <a th:href="@{/models}" th:attr="aria-current=${page == 'models'} ? 'page' : null">Model cards</a>
            <a th:href="@{/entities}" th:attr="aria-current=${page == 'entities'} ? 'page' : null">Categories and sellers</a>
        </div>

        <div class="sidebar-section">
            <a th:href="@{/help}" th:attr="aria-current=${page == 'help'} ? 'page' : null">Help</a>
            <a th:href="@{/about}" th:attr="aria-current=${page == 'about'} ? 'page' : null">About</a>
        </div>

        <div class="sidebar-section">
            <p class="sidebar-section-title mt-0 mb-2">Data</p>
            <p class="sidebar-data m-0">Olist Brazilian marketplace, January 2017 to August 2018. Gross item sales in
                Brazilian reais (BRL).</p>
        </div>
    </nav>
    <div id="sidebar-overlay"></div>
</div>
