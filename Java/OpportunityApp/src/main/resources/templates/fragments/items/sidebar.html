<div th:fragment="sidebar">
    <!-- SolarERP's sidebar, keeping only what this site has: no account, and the four screens instead of planets. -->
    <style>
        #sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--bg-shell);
            color: var(--text-color);
            padding: 0;
            transition: left 0.3s;
            z-index: 1050;
            overflow-y: auto;
            overscroll-behavior: contain;
            box-shadow: 2px 0 15px rgba(0, 0, 0, 0.6);
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 1.25rem 1.5rem;
            background: var(--bg-deep);
            border-bottom: 2px solid var(--line-strong);
        }

        .sidebar-header h5 {
            font-size: 1rem;
            letter-spacing: 0.8px;
        }

        .sidebar-section {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--line);
        }

        .sidebar-section-title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            color: var(--muted);
        }

        #sidebar a {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-radius: 4px;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        #sidebar a:hover {
            background: var(--row-hover);
            padding-left: 1rem;
        }

        /* the page being shown: the accent tint, with an accent edge so it does not rely on colour alone */
        #sidebar a[aria-current="page"] {
            background: var(--accent-tint);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .sidebar-data {
            font-size: .8rem;
            color: var(--muted);
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1040;
        }

        #sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>

    <nav id="sidebar" aria-label="Screens">
        <div class="sidebar-header">
            <h5 class="m-0 fw-bold text-uppercase">Navigation</h5>
        </div>

        <div class="sidebar-section">
            <a th:href="@{/}" th:attr="aria-current=${page == 'overview'} ? 'page' : null">📊 Overview</a>
            <a th:href="@{/categories}" th:attr="aria-current=${page == 'categories'} ? 'page' : null">🧩 Category health</a>
            <a th:href="@{/risk}" th:attr="aria-current=${page == 'risk'} ? 'page' : null">🚚 Delivery and reviews</a>
            <a th:href="@{/scenario}" th:attr="aria-current=${page == 'scenario'} ? 'page' : null">🔮 What if sales change?</a>
            <a th:href="@{/help}" th:attr="aria-current=${page == 'help'} ? 'page' : null">📘 Help</a>
        </div>

        <div class="sidebar-section">
            <p class="sidebar-section-title text-uppercase mt-0 mb-2">Flagged categories</p>
            <a th:href="@{/categories(flag='underperforming_total')}">Falling behind the business</a>
            <a th:href="@{/categories(flag='latest_month_anomaly')}">Unusual latest month</a>
        </div>

        <div class="sidebar-section">
            <p class="sidebar-section-title text-uppercase mt-0 mb-2">Data</p>
            <p class="sidebar-data m-0">Olist Brazilian marketplace, January 2017 to August 2018. Gross item sales in
                Brazilian reais (BRL).</p>
        </div>
    </nav>
    <div id="sidebar-overlay"></div>
</div>
