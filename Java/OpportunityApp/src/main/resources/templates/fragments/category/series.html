<section th:fragment="series(c)">
    <h2 class="mod-section-title fw-semibold fs-5">Monthly sales</h2>
    <div class="mod-card"><div class="chart short"><canvas id="category-chart" aria-label="Monthly sales for this category"></canvas></div></div>
    <p class="muted-note mt-2" th:if="${c.forecast == null}">No forecast: <th:block th:text="${c.forecast_reason == 'insufficient_history'} ? 'this category does not have enough monthly history.' : ${c.forecast_reason}"></th:block></p>
    <details class="mod-card mt-3">
        <summary>Monthly figures</summary>
        <div class="mod-table table-responsive">
            <table class="table mb-0">
                <thead><tr><th>Month</th><th class="n">Orders</th><th class="n">Items</th><th class="n">Sales</th></tr></thead>
                <tbody>
                <tr th:each="m : ${c.series}">
                    <td th:text="${m.month}"></td><td class="n" th:text="${@format.num(m.orders, 0)}"></td>
                    <td class="n" th:text="${@format.num(m.items, 0)}"></td><td class="n" th:text="${@format.brl(m.sales)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </details>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => MosaicCharts.category('category-chart', /*[[${c.series}]]*/ null, /*[[${c.forecast}]]*/ null));
    </script>
</section>
