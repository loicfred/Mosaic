<!-- A measure's monthly figures, the evidence behind its change, and the suggestion and caveats the tabs ask for. -->
<section th:fragment="page" th:if="${trend != null}">
    <h2 class="mod-section-title" th:text="|${trend.label} by month|">Late-delivery rate by month</h2>
    <p class="section-note">What happened, by purchase month. This page compares the last 3 months with the 3 before; it does not forecast.</p>
    <div class="mod-card obs">
        <div class="chart"><canvas id="trend-chart" th:aria-label="|${trend.label} by month|"></canvas></div>
    </div>

    <div th:replace="~{/fragments/items/panels :: tabs('/api/trend/' + ${measure.path})}"></div>

    <div id="evidence-panel" class="mt-3" hidden>
        <div class="mod-card obs">
            <h3>The comparison</h3>
            <div class="mod-table table-responsive">
                <table class="table mb-0">
                    <thead><tr><th>Period</th><th>Months</th><th class="n" th:text="${trend.label}">Value</th><th class="n">Orders counted</th></tr></thead>
                    <tbody>
                    <tr>
                        <td>3 months before</td>
                        <td th:text="${#strings.listJoin(trend.trend.previous_months, ', ')}"></td>
                        <td class="n" th:text="${@format.unit(trend.unit, trend.trend.previous.value)}"></td>
                        <td class="n" th:text="${@format.num(trend.trend.previous.orders, 0)}"></td>
                    </tr>
                    <tr>
                        <td>Last 3 months</td>
                        <td th:text="${#strings.listJoin(trend.trend.recent_months, ', ')}"></td>
                        <td class="n" th:text="${@format.unit(trend.unit, trend.trend.recent.value)}"></td>
                        <td class="n" th:text="${@format.num(trend.trend.recent.orders, 0)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="mt-3 mb-0" th:text="|Change: ${@format.unitChange(trend.trend)}. ${trend.good_direction == 'down' ? 'Lower' : 'Higher'} is better.|"></p>
        </div>
        <details class="mod-card mt-3" open>
            <summary>How it is calculated</summary>
            <ul class="plain">
                <th:block th:each="r : ${trend.rules}">
                    <li th:if="${r.key != 'thresholds'}" th:text="|${@format.label(r.key)}: ${r.value}|"></li>
                </th:block>
                <li th:each="t : ${trend.rules.thresholds}" th:text="|Caveat threshold, ${@format.label(t.key)}: ${t.value}|"></li>
            </ul>
        </details>
        <details class="mod-card mt-3" open>
            <summary>Limitations</summary>
            <ul class="plain"><li th:each="l : ${trend.limitations}" th:text="${l}"></li></ul>
        </details>
    </div>

    <th:block th:replace="~{/fragments/items/panels :: answers}"></th:block>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => MosaicTrend.page(/*[[${trend}]]*/ null));
    </script>
</section>
