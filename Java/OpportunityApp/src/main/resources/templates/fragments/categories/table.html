<!-- Every category against the business, with the flag filters as SolarERP's pill row. -->
<section th:fragment="categoryTable">
    <nav class="mod-nav d-flex flex-wrap mb-3" aria-label="Filter">
        <a th:href="@{/categories}" th:classappend="${flag == null} ? 'on'" th:attr="aria-current=${flag == null}">All categories</a>
        <a th:href="@{/categories(flag='underperforming_total')}" th:classappend="${flag == 'underperforming_total'} ? 'on'" th:attr="aria-current=${flag == 'underperforming_total'}">Falling behind the business</a>
        <a th:href="@{/categories(flag='latest_month_anomaly')}" th:classappend="${flag == 'latest_month_anomaly'} ? 'on'" th:attr="aria-current=${flag == 'latest_month_anomaly'}">Unusual latest month</a>
    </nav>

    <div th:replace="~{/fragments/items/notice :: error(${categoriesError})}"></div>

    <th:block th:if="${categories != null}">
        <p class="muted-note" th:text="|${categories.count} categories, largest recent sales first. Select one to see its evidence.|"></p>
        <div class="mod-empty" th:if="${categories.count == 0}">No category is flagged for this. Try another filter.</div>
        <div class="mod-table table-responsive" th:unless="${categories.count == 0}">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th>Category</th>
                    <th class="n">Recent sales</th>
                    <th class="n">Previous sales</th>
                    <th class="n">Change</th>
                    <th class="n">Share of sales</th>
                    <th>Flags</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categories.categories}">
                    <td><a th:href="@{/categories/{n}(n=${c.category})}" th:text="${@format.label(c.category)}">Category</a></td>
                    <td class="n" th:text="${@format.brl(c.recent)}"></td>
                    <td class="n" th:text="${@format.brl(c.previous)}"></td>
                    <td class="n" th:classappend="${c.change_pct != null and c.change_pct < c.total_change_pct} ? 'down'" th:text="${@format.pct(c.change_pct)}"></td>
                    <td class="n" th:text="${@format.pp(c.share_change_pp)}"></td>
                    <td>
                        <span class="flag" th:if="${c.flags.underperforming_total}">Falling behind</span>
                        <span class="flag" th:if="${c.flags.latest_month_anomaly}">Unusual month</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</section>
