<div data-pane="data" hidden th:fragment="dataNavigation">
    <div class="doc-tree-group">
        <button class="doc-chapter-title doc-tree-toggle text-uppercase d-flex align-items-center w-100 border-0 bg-transparent text-start"
                type="button" aria-expanded="true">
            <svg class="mod-chevron flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            <span>Datasets</span></button>
        <div class="doc-tree-children">
            <a href="#data-datasets">All files</a>
            <a th:each="f : ${datasets?.files ?: {}}" class="doc-sub" th:href="|#data-${f.file}|" th:title="${f.file}" th:text="${f.file}">file.csv</a>
        </div>
    </div>
    <div class="doc-tree-group">
        <button class="doc-chapter-title doc-tree-toggle text-uppercase d-flex align-items-center w-100 border-0 bg-transparent text-start"
                type="button" aria-expanded="true">
            <svg class="mod-chevron flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            <span>AI</span></button>
        <div class="doc-tree-children">
            <a href="#data-models">Trained models</a>
            <a href="#data-language">Language model</a>
        </div>
    </div>
</div>
