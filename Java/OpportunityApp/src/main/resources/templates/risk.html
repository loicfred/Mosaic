<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/fragments/head :: pageHead('Delivery and reviews')}"></th:block>
</head>
<body>

<header th:replace="~{/fragments/header :: mainHeader}" id="master-header"></header>

<main class="mod-page mx-auto">
    <section class="mod-hero position-relative overflow-hidden">
        <h1 class="statement m-0">Late deliveries and the reviews that follow them</h1>
        <p class="lede mt-3 mb-0" th:if="${reviews != null}">
            Late orders got a review of 1 or 2 stars
            <span class="v bad" th:text="${@format.rate(reviews.by_lateness.late.low_rate, 1)}">62.4%</span> of the time;
            on-time orders, <span class="v" th:text="${@format.rate(reviews.by_lateness.on_time.low_rate, 1)}">9.2%</span>.
        </p>
        <p class="mt-2 mb-0" th:if="${reviews != null}" th:text="|From ${@format.num(reviews.by_lateness.late.reviewed, 0)} late and ${@format.num(reviews.by_lateness.on_time.reviewed, 0)} on-time reviewed orders. This shows the two go together, not that one causes the other.|"></p>
    </section>

    <section th:replace="~{/fragments/risk/delivery :: delivery}"></section>
    <section th:replace="~{/fragments/risk/open-orders :: openOrders}"></section>
    <section th:replace="~{/fragments/risk/sellers :: sellers}"></section>
    <section th:replace="~{/fragments/risk/reviews :: reviews}"></section>
</main>

<footer th:replace="~{/fragments/footer :: mainFooter}" id="master-footer"></footer>
</body>
</html>
