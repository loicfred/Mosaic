<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- SolarERP's login layout (a brand side and a form card) in Mosaic's colours; no page scripts before sign-in -->
    <meta charset="UTF-8">
    <title>Mosaic - New password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/img/mosaic.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <div class="auth-brand">
        <img class="auth-logo" th:src="@{/img/logo.jpg}" alt="Mosaic" width="96" height="96">
        <h1>Mosaic</h1>
        <p class="auth-tagline">Almost done. Your old password stops working once you save.</p>
    </div>
    <div class="auth-form-side">
        <div class="auth-card">
            <h2>Choose a new password</h2>
            <p class="auth-subtitle">At least 8 characters</p>

            <div th:if="${param.badpassword}" class="alert alert-danger">The password needs 8 to 72 characters.</div>
            <div th:if="${param.mismatch}" class="alert alert-danger">The two passwords do not match.</div>

            <form th:action="@{/auth/v1/newpassword}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="72" class="form-control" autocomplete="new-password" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="confirm" class="form-label">Confirm password</label>
                    <input type="password" id="confirm" name="confirm" minlength="8" maxlength="72" class="form-control" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-auth w-100">Save the new password</button>
            </form>
            <p class="auth-links mt-3 mb-0">Remembered it? <a th:href="@{/auth/v1/login}">Log in</a></p>
        </div>
    </div>
</div>
</body>
</html>
