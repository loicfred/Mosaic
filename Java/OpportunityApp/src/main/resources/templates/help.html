<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/fragments/head :: pageHead('Help')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/help.css}">
</head>

<!-- SolarERP's Help, without its dictionary and plugin chapters: a reference column the reader can widen, a tab strip,
     and pages that read like entries. Each tab is a folder of fragments/help holding its navigation and its content. -->
<body data-bs-spy="scroll" data-bs-target="#doc-nav" data-bs-root-margin="0px 0px -70%" data-bs-smooth-scroll="true"
      tabindex="0">

<header th:replace="~{/fragments/header :: mainHeader}" id="master-header"></header>

<div class="doc-layout d-flex flex-grow-1">

    <aside class="doc-side flex-shrink-0">
        <div class="doc-side-inner position-sticky overflow-auto">
            <h4 class="mb-1">Help</h4>
            <p class="mod-note mb-3">How to read Mosaic, what it serves, and what it is built on.</p>

            <input class="form-control form-control-sm mb-2" id="doc-filter" type="search" placeholder="Search..."
                   autocomplete="off" aria-label="Search the help">

            <nav id="doc-nav" class="nav flex-column">
                <div th:replace="~{/fragments/help/guide/navigation :: guideNavigation}"></div>
                <div th:replace="~{/fragments/help/endpoints/navigation :: endpointsNavigation}"></div>
                <div th:replace="~{/fragments/help/data/navigation :: dataNavigation}"></div>
            </nav>
        </div>
    </aside>

    <div class="doc-drag d-none d-md-block flex-shrink-0" role="separator" aria-label="Resize the help column"></div>

    <main class="doc-main flex-grow-1">
        <ul class="nav nav-tabs mod-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link doc-tab active" type="button" role="tab" data-pane="guide" aria-selected="true">Guide</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link doc-tab" type="button" role="tab" data-pane="endpoints" aria-selected="false">Endpoints</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link doc-tab" type="button" role="tab" data-pane="data" aria-selected="false">Data and AI</button>
            </li>
        </ul>

        <div class="doc-main-inner">
            <div th:replace="~{/fragments/help/guide/content :: guideContent}"></div>
            <div th:replace="~{/fragments/help/endpoints/content :: endpointsContent}"></div>
            <div th:replace="~{/fragments/help/data/content :: dataContent}"></div>
        </div>
    </main>

</div>

<footer th:replace="~{/fragments/footer :: mainFooter}" id="master-footer"></footer>

<script>
    // Bootstrap is loaded deferred in the head, so this waits for it.
    document.addEventListener('DOMContentLoaded', () => {
        const filter = document.getElementById('doc-filter');
        const nav = document.getElementById('doc-nav');
        const tabs = [...document.querySelectorAll('.doc-tab')];
        const panes = paneName => [...document.querySelectorAll(`[data-pane="${paneName}"]:not(.doc-tab)`)];

        /** Scrollspy measures the links it is given, so the panes that are away are hidden rather than merely scrolled past. */
        function openTab(wanted) {
            tabs.forEach(tab => {
                const open = tab.dataset.pane === wanted;
                tab.classList.toggle('active', open);
                tab.setAttribute('aria-selected', String(open));
                panes(tab.dataset.pane).forEach(pane => pane.hidden = !open);
            });
            filter.value = '';
            applyFilter();
            bootstrap.ScrollSpy.getInstance(document.body)?.refresh();
        }

        tabs.forEach(tab => tab.addEventListener('click', () => openTab(tab.dataset.pane)));

        /** Each heading folds the links beneath it. */
        nav.querySelectorAll('.doc-tree-toggle').forEach(title => title.addEventListener('click', () => {
            const group = title.parentElement;
            group.classList.toggle('collapsed');
            title.setAttribute('aria-expanded', String(!group.classList.contains('collapsed')));
        }));

        /** Hides a heading as soon as none of its own links survive the filter, so the column never shows an empty one. */
        function applyFilter() {
            const wanted = filter.value.trim().toLowerCase();
            nav.classList.toggle('searching', wanted !== '');
            const pane = nav.querySelector('[data-pane]:not([hidden])');
            if (!pane) return;
            pane.querySelectorAll('.doc-tree-group').forEach(group => {
                const heading = group.querySelector(':scope > button span').textContent;
                const links = [...group.querySelectorAll('a')];
                links.forEach(link => link.hidden = !`${heading} ${link.textContent}`.toLowerCase().includes(wanted));
                group.hidden = links.every(link => link.hidden);
            });
        }

        filter.addEventListener('input', applyFilter);

        const side = document.querySelector('.doc-side');
        const handle = document.querySelector('.doc-drag');

        /** The reader sets how wide the list is; kept per browser, so the width survives the next visit. */
        function dragSide(event) {
            side.style.width = Math.min(Math.max(event.clientX - side.getBoundingClientRect().left, 200), 560) + 'px';
        }

        handle.addEventListener('pointerdown', event => {
            handle.setPointerCapture(event.pointerId);
            document.body.classList.add('dragging');
        });
        handle.addEventListener('pointermove', event => {
            if (handle.hasPointerCapture(event.pointerId)) dragSide(event);
        });
        handle.addEventListener('pointerup', event => {
            handle.releasePointerCapture(event.pointerId);
            document.body.classList.remove('dragging');
            try { localStorage.setItem('doc-side-width', side.style.width); } catch (e) { /* storage blocked: width lasts this visit */ }
        });
        try { side.style.width = localStorage.getItem('doc-side-width') || ''; } catch (e) { /* storage blocked */ }

        /** A link shared from any tab opens on that tab, with its heading unfolded - on arrival, and when only the address's #part changes. */
        function followHash(fallback) {
            const linked = [...nav.querySelectorAll('a')].find(a => a.getAttribute('href') === location.hash);
            if (!linked) {
                if (fallback) openTab(fallback);
                return;
            }
            const pane = linked.closest('[data-pane]');
            if (pane.hidden) openTab(pane.dataset.pane); // a click inside the open tab keeps the reader's search
            linked.closest('.doc-tree-group')?.classList.remove('collapsed');
            document.getElementById(location.hash.slice(1))?.scrollIntoView();
        }

        window.addEventListener('hashchange', () => followHash(null));
        followHash('guide');
    });
</script>
</body>
</html>
