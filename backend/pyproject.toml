[project]
name = "opportunityos-backend"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "S608", "E731", "SIM108", "UP042", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]
"../scripts/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
